{% extends "base.html" %}

{% block title %}
Edit Vehicle - Sagar Motors
{% endblock %}


{% block content %}

<h2 class="mb-4">
✏️ Edit Vehicle Record
</h2>


<form method="POST">

<div class="row">


<div class="col-md-6 mb-3">

<label class="form-label">
Vehicle Number
</label>

<input
type="text"
name="vehicle_number"
class="form-control"
value="{{ vehicle['vehicle_number'] }}"
required>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Customer Name
</label>

<input
type="text"
name="customer_name"
class="form-control"
value="{{ vehicle['customer_name'] }}"
required>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Mobile
</label>

<input
type="text"
name="mobile"
class="form-control"
value="{{ vehicle['mobile'] }}">

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Vehicle Model
</label>

<input
type="text"
name="vehicle_model"
class="form-control"
value="{{ vehicle['vehicle_model'] }}">

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
KM
</label>

<input
type="number"
name="km"
class="form-control"
value="{{ vehicle['km'] }}">

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Mechanic
</label>

<input
type="text"
name="mechanic"
class="form-control"
value="{{ vehicle['mechanic'] }}">

</div>


<div class="col-12 mb-3">

<label class="form-label">
Problem
</label>

<textarea
name="problem"
class="form-control"
rows="3">{{ vehicle['problem'] }}</textarea>

</div>


<div class="col-12 mb-3">

<label class="form-label">
Work Done
</label>

<textarea
name="work_done"
class="form-control"
rows="3">{{ vehicle['work_done'] }}</textarea>

</div>


<div class="col-md-4 mb-3">

<label class="form-label">
Status
</label>

<select
name="status"
class="form-select">

<option
value="Pending"
{% if vehicle['status'] == 'Pending' %}selected{% endif %}>
Pending
</option>

<option
value="In Progress"
{% if vehicle['status'] == 'In Progress' %}selected{% endif %}>
In Progress
</option>

<option
value="Completed"
{% if vehicle['status'] == 'Completed' %}selected{% endif %}>
Completed
</option>

</select>

</div>


<div class="col-md-4 mb-3">

<label class="form-label">
Amount
</label>

<input
type="number"
step="0.01"
name="amount"
class="form-control"
value="{{ vehicle['amount'] }}">

</div>


<div class="col-md-4 mb-3">

<label class="form-label">
Time Out
</label>

<input
type="text"
name="time_out"
class="form-control"
value="{{ vehicle['time_out'] or '' }}"
placeholder="04:30 PM">

</div>


<div class="col-12 mb-3">

<label class="form-label">
Remarks
</label>

<textarea
name="remarks"
class="form-control"
rows="2">{{ vehicle['remarks'] }}</textarea>

</div>


</div>


<button
class="btn btn-success btn-lg">

Update Record

</button>


<a
href="{{ url_for('vehicles') }}"
class="btn btn-secondary btn-lg">

Cancel

</a>


</form>

{% endblock %}
