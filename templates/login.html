<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sagar Motors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
        }

        .brand {
            font-weight: bold;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="login-box">

        <div class="card shadow">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <div class="brand">SAGAR MOTORS</div>
                    <div class="subtitle">MAHINDRA SPECIALIST</div>
                </div>

                <h4 class="text-center mb-4">Admin Login</h4>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-dark w-100">
                        Login
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

</body>
</html>
