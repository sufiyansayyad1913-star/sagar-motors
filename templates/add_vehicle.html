{% extends "base.html" %}

{% block title %}
New Vehicle - Sagar Motors
{% endblock %}


{% block content %}

<h2 class="mb-4">
    🚗 New Vehicle Entry
</h2>


<form method="POST">


<div class="row">


<div class="col-md-6 mb-3">

<label class="form-label">
Vehicle Number *
</label>

<input
type="text"
name="vehicle_number"
class="form-control"
placeholder="MH 26 AB 1234"
required>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Customer Name *
</label>

<input
type="text"
name="customer_name"
class="form-control"
required>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Mobile Number
</label>

<input
type="tel"
name="mobile"
class="form-control"
placeholder="9876543210">

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Vehicle Model
</label>

<input
type="text"
name="vehicle_model"
class="form-control"
placeholder="Mahindra Bolero">

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Current KM *
</label>

<input
type="number"
name="km"
class="form-control"
required>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Mechanic
</label>

<input
type="text"
name="mechanic"
class="form-control">

</div>


<div class="col-12 mb-3">

<label class="form-label">
Problem / Customer Complaint *
</label>

<textarea
name="problem"
class="form-control"
rows="3"
required></textarea>

</div>


<div class="col-12 mb-3">

<label class="form-label">
Work Done
</label>

<textarea
name="work_done"
class="form-control"
rows="3"></textarea>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Status
</label>

<select
name="status"
class="form-select">

<option value="Pending">
Pending
</option>

<option value="In Progress">
In Progress
</option>

<option value="Completed">
Completed
</option>

</select>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Amount
</label>

<input
type="number"
step="0.01"
name="amount"
class="form-control"
value="0">

</div>


<div class="col-12 mb-3">

<label class="form-label">
Remarks
</label>

<textarea
name="remarks"
class="form-control"
rows="2"></textarea>

</div>


</div>


<button
type="submit"
class="btn btn-success btn-lg">

Save Vehicle

</button>


<a
href="{{ url_for('dashboard') }}"
class="btn btn-secondary btn-lg">

Cancel

</a>


</form>

{% endblock %}
